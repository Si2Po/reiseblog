# Ruft die Supabase-Datenbank einmal am Tag kurz an, damit das kostenlose Projekt nicht einschläft
# (Supabase pausiert kostenlose Projekte nach 7 Tagen ohne Nutzung).
# Adresse und öffentlicher Schlüssel kommen aus src/lib/config.ts.
name: Wecker

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  wecken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: src/lib/config.ts
          sparse-checkout-cone-mode: false

      - name: Datenbank anrufen
        run: |
          URL=$(sed -n "s/^export const SUPABASE_URL = '\(.*\)';/\1/p" src/lib/config.ts)
          KEY=$(sed -n "s/^export const SUPABASE_KEY = '\(.*\)';/\1/p" src/lib/config.ts)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase ist noch nicht eingerichtet – nichts zu tun."
            exit 0
          fi
          curl -sf -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo

      # GitHub schaltet zeitgesteuerte Abläufe nach 60 Tagen ohne Änderungen am Repo ab.
      # Dieser Schritt schaltet den Wecker jedes Mal wieder ein, damit das nie passiert.
      - name: Wecker eingeschaltet lassen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/wecker.yml/enable"
